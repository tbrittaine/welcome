<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hover Rollover Gallery</title>
  <style>
    /* Reset margins & padding */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #e5e5e5; /* Updated background color */
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Outer horizontal layout container */
    .gallery-container {
      display: flex;
      flex-direction: row;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 2000px;
      gap: 0px; /* Zero gap between images */
      background-color: #e5e5e5;
    }

    /* Individual image card (1:1 ratio) */
    .image-card {
      position: relative;
      flex: 1 1 0%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      cursor: pointer;
      background-color: #e5e5e5;
    }

    /* Image positioning */
    .image-card img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Base image stays solid underneath (prevents flash) */
    .image-card .img-default {
      opacity: 1;
      z-index: 1;
    }

    /* Rollover image sits on top and smoothly fades in */
    .image-card .img-hover {
      opacity: 0;
      z-index: 2;
      transition: opacity 0.25s ease-in-out; /* Smooth fade overlay */
    }

    /* Only transition the top hover image */
    .image-card:hover .img-hover {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="gallery-container">
    
    <!-- Left Image: Motion -->
    <div class="image-card">
      <img src="Welcome_Page_Motion_NORM.png" alt="Motion" class="img-default">
      <img src="Welcome_Page_Motion_OVER.png" alt="Motion Hover" class="img-hover">
    </div>

    <!-- Right Image: Concept -->
    <div class="image-card">
      <img src="Welcome_Page_Concept_NORM.png" alt="Concept" class="img-default">
      <img src="Welcome_Page_Concept_OVER.png" alt="Concept Hover" class="img-hover">
    </div>

  </div>

</body>
</html>
